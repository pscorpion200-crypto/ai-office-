services:
  - type: web
    name: ai-office
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: ai-office-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-6
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: OFFICE_PASSWORD
        sync: false
