<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Office Pro</title><style>
*{box-sizing:border-box}body{margin:0;background:#111820;color:#e8edf3;font-family:Tahoma,Arial}.top{padding:16px 22px;background:#192430;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid #334250}.top h1{margin:0;font-size:20px}.top small{color:#9fb0c1}.shell{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 70px)}aside{background:#17212c;padding:16px;border-left:1px solid #31404d}main{padding:18px;min-width:0}.card{background:#202c38;border:1px solid #344452;border-radius:14px;padding:14px;margin-bottom:12px}.btn{background:#26394a;color:#eaf3fb;border:1px solid #405568;border-radius:10px;padding:10px 12px;font:inherit;cursor:pointer}.btn:hover{border-color:#86b5d4}.primary{background:#327c69;border-color:#327c69}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#202c38;border:1px solid #344452;border-radius:12px;padding:12px}.stat b{display:block;font-size:22px;margin-top:5px}.map{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}.room{min-height:150px;background:#263645;border:1px solid #415668;border-radius:15px;padding:13px;cursor:pointer;transition:.15s}.room:hover{transform:translateY(-2px);border-color:#6fae9b}.room h3{margin:0 0 6px;font-size:15px}.room p{color:#9fb0c1;font-size:12px}.employee{margin-top:20px;border-radius:12px;padding:10px;background:#182530;border:1px solid #3b4c59;display:flex;align-items:center;gap:10px}.avatar{font-size:27px}.pill{font-size:11px;color:#9cd7bd}.task{background:#192630;padding:10px;border-radius:10px;margin:7px 0}.muted{color:#96a6b5;font-size:12px}.modal{position:fixed;inset:0;background:#0009;display:flex;justify-content:center;align-items:center;padding:12px}.box{background:#192530;border:1px solid #3c5263;border-radius:16px;width:min(850px,100%);max-height:90vh;overflow:auto;padding:18px}textarea,input{width:100%;padding:12px;border-radius:10px;background:#111a22;color:white;border:1px solid #435565;font:inherit}textarea{min-height:100px}.chat{max-height:45vh;overflow:auto;background:#111a22;border-radius:12px;padding:10px;margin:12px 0}.msg{white-space:pre-wrap;padding:10px;border-radius:10px;background:#263645;margin:8px 0}.msg.user{background:#315b53}.row{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none}@media(max-width:850px){.shell{grid-template-columns:1fr}.map{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:450px){.map{grid-template-columns:1fr}}</style></head><body>
<header class="top"><div><h1>🏢 AI Office Pro</h1><small>مركز تشغيل الوكلاء — النسخة القابلة للربط</small></div><div class="row"><button class="btn" onclick="refresh()">تحديث</button><button class="btn" onclick="settings()">الإعدادات</button></div></header>
<div class="shell"><aside><div class="card"><h3>حالة النظام</h3><div id="status">جارٍ الفحص…</div><p class="muted">تحتاج إعداد الخادم ومفتاح API لتشغيل المحادثات.</p></div><div class="card"><h3>مدير الشركة</h3><button class="btn primary" style="width:100%" onclick="openChat('ceo')">مكتب المدير التنفيذي</button></div><div class="card"><h3>تخطيط جماعي</h3><textarea id="goal" placeholder="اكتب هدف الشركة ليقسمه المدير إلى مهام..."></textarea><button class="btn primary" style="width:100%;margin-top:8px" onclick="plan()">قسّم الهدف إلى مهام</button></div><div class="card"><button class="btn" style="width:100%" onclick="exportTasks()">تصدير المهام</button></div></aside>
<main><div class="stats"><div class="stat">الوكلاء<b id="nAgents">8</b></div><div class="stat">المهام<b id="nTasks">0</b></div><div class="stat">حالة AI<b id="aiState">—</b></div><div class="stat">البيانات<b>محلية</b></div></div><h2>مخطط المكتب</h2><div class="map" id="map"></div><h2>المهام</h2><div class="card" id="tasks">تحميل المهام…</div></main></div>
<div id="modal" class="hidden modal"><div class="box" id="box"></div></div><script>
let agents=[],tasks=[];const emoji={ceo:'👔',research:'🔎',communication:'✉️',finance:'📊',marketing:'🎨',income:'🚀',operations:'🗂️',innovation:'💡'};
async function api(url,opts={}){let r=await fetch(url,{headers:{'Content-Type':'application/json'},...opts});let d=await r.json();if(!r.ok)throw Error(d.error||r.status);return d}
async function refresh(){try{let [a,t,s]=await Promise.all([api('/api/agents'),api('/api/tasks'),api('/api/status')]);agents=a;tasks=t;document.getElementById('nAgents').textContent=a.length;document.getElementById('nTasks').textContent=t.length;document.getElementById('aiState').textContent=s.configured?'متصل':'غير مربوط';document.getElementById('status').innerHTML=s.configured?'🟢 API مضبوط<br>النموذج: '+esc(s.model):'🟠 يحتاج إعداد مفتاح API';renderMap();renderTasks()}catch(e){document.getElementById('status').innerHTML='🔴 الخادم غير متصل<br><span class="muted">'+esc(e.message)+'</span>'}}
function renderMap(){document.getElementById('map').innerHTML=agents.map(a=>`<div class="room" onclick="openChat('${a.id}')"><h3>${emoji[a.id]||'🤖'} ${esc(a.name)}</h3><p>${esc(a.room)} · ${esc(a.role)}</p><div class="employee"><span class="avatar">${emoji[a.id]||'🤖'}</span><div><b>${esc(a.name)}</b><div class="pill">● مساحة العمل</div></div></div></div>`).join('')}
function renderTasks(){document.getElementById('tasks').innerHTML=tasks.length?tasks.map(t=>`<div class="task"><b>${esc(agentName(t.agentId))}</b><p>${esc(t.title)}</p><div class="muted">${esc(t.description||'')} · ${esc(t.status)}</div><div class="row" style="margin-top:8px"><button class="btn" onclick="setStatus('${t.id}','in_progress')">قيد التنفيذ</button><button class="btn" onclick="setStatus('${t.id}','done')">إنجاز</button><button class="btn" onclick="delTask('${t.id}')">حذف</button></div></div>`).join(''):'لا توجد مهام مسجلة'}
function agentName(id){return agents.find(a=>a.id===id)?.name||id}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function openChat(id){let a=agents.find(x=>x.id===id);if(!a)return;let hist=await api('/api/chat/'+id);document.getElementById('box').innerHTML=`<h2>${emoji[id]} ${esc(a.name)}</h2><p class="muted">${esc(a.role)}</p><div class="chat" id="chat">${hist.map(m=>`<div class="msg ${m.role==='user'?'user':''}"><b>${m.role==='user'?'أنت':'الموظف'}:</b><br>${esc(m.content)}</div>`).join('')}</div><textarea id="message" placeholder="اكتب توجيهك أو سؤالك..."></textarea><div class="row" style="margin-top:10px"><button class="btn primary" onclick="send('${id}')">إرسال</button><button class="btn" onclick="addTask('${id}')">تسجيل مهمة</button><button class="btn" onclick="closeModal()">إغلاق</button></div>`;showModal();scrollChat()}
async function send(id){let inp=document.getElementById('message'),m=inp.value.trim();if(!m)return;inp.disabled=true;try{let d=await api('/api/chat/'+id,{method:'POST',body:JSON.stringify({message:m})});let c=document.getElementById('chat');c.innerHTML+=`<div class="msg user"><b>أنت:</b><br>${esc(m)}</div><div class="msg"><b>الموظف:</b><br>${esc(d.reply)}</div>`;inp.value='';scrollChat()}catch(e){alert(e.message)}finally{inp.disabled=false}}
async function addTask(id){let title=prompt('عنوان المهمة؟');if(!title)return;let description=prompt('تفاصيل المهمة (اختياري)')||'';await api('/api/tasks',{method:'POST',body:JSON.stringify({agentId:id,title,description})});refresh();alert('تم تسجيل المهمة')}
async function setStatus(id,status){await api('/api/tasks/'+id,{method:'PATCH',body:JSON.stringify({status})});refresh()}async function delTask(id){await api('/api/tasks/'+id,{method:'DELETE'});refresh()}
async function plan(){let goal=document.getElementById('goal').value.trim();if(!goal)return alert('اكتب الهدف');try{let d=await api('/api/manager/plan',{method:'POST',body:JSON.stringify({goal})});alert('تم توزيع '+(d.plan||[]).length+' مهمة على الأقسام');refresh()}catch(e){alert(e.message)}}
function settings(){document.getElementById('box').innerHTML='<h2>إعداد وتشغيل</h2><p>مفتاح API لا يدخل من الواجهة؛ يحفظ في ملف .env على الخادم فقط.</p><ol><li>فك ضغط الحزمة على جهاز الكمبيوتر.</li><li>ثبّت Node.js.</li><li>نفذ npm install.</li><li>انسخ .env.example إلى .env.</li><li>ضع مفتاح API ونموذج متوافق مع API_BASE_URL.</li><li>نفذ npm start ثم افتح http://localhost:3000.</li></ol><p class="muted">لا ترفع ملف .env أو المفتاح إلى مستودع عام.</p><button class="btn" onclick="closeModal()">إغلاق</button>';showModal()}
function showModal(){document.getElementById('modal').classList.remove('hidden')}function closeModal(){document.getElementById('modal').classList.add('hidden')}function scrollChat(){let c=document.getElementById('chat');if(c)c.scrollTop=c.scrollHeight}
function exportTasks(){let b=new Blob([JSON.stringify(tasks,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ai-office-tasks.json';a.click()}
refresh();
</script></body></html>
